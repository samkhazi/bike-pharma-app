# Builds the Bike Pharma Android app on every push to this branch (mobile-app).
#   Test APK  (BikePharma-test.apk): always, signed with the test key in android/app/debug.keystore.
#   Play AAB  (BikePharma-play.aab): only when the four BP_UPLOAD_* secrets are set in GitHub
#             (Settings > Secrets and variables > Actions); it is signed with Bike Pharma's own upload key.
# The files (and build.log) are put on the branch app-builds, one commit, replaced on every build.
name: Android app
on:
  push:
    branches: [mobile-app]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-app
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        working-directory: android
        env:
          BP_UPLOAD_KEYSTORE_B64: ${{ secrets.BP_UPLOAD_KEYSTORE_B64 }}
          BP_UPLOAD_STORE_PASSWORD: ${{ secrets.BP_UPLOAD_STORE_PASSWORD }}
          BP_UPLOAD_KEY_ALIAS: ${{ secrets.BP_UPLOAD_KEY_ALIAS }}
          BP_UPLOAD_KEY_PASSWORD: ${{ secrets.BP_UPLOAD_KEY_PASSWORD }}
        run: |
          set -o pipefail
          mkdir -p ../out
          tasks="assembleDebug"
          if [ -n "$BP_UPLOAD_KEYSTORE_B64" ]; then
            printf '%s' "$BP_UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export BP_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks"
            tasks="$tasks bundleRelease"
          fi
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace $tasks 2>&1 | tee ../out/build.log
          cp app/build/outputs/apk/debug/app-debug.apk ../out/BikePharma-test.apk
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then cp app/build/outputs/bundle/release/app-release.aab ../out/BikePharma-play.aab; fi
          rm -f "$RUNNER_TEMP/upload.jks"
      - name: Put the files on the app-builds branch
        if: always()
        env:
          TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          mkdir -p out && cd out
          echo "$STATUS $(git -C .. rev-parse --short HEAD) $(date -u +%FT%TZ)" > BUILD.txt
          ls -l >> BUILD.txt
          git init -q -b app-builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Android build $(head -1 BUILD.txt)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" app-builds
