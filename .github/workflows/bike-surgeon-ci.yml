name: Bike Surgeon app checks
on:
  push:
    branches: ["claude/project-thread-vczbd1"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bikesurgeon
          POSTGRES_PASSWORD: bikesurgeon
          POSTGRES_DB: bikesurgeon
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U bikesurgeon" --health-interval 2s --health-timeout 3s --health-retries 20
      # Stands in for the workshop's old billing MySQL (same version as the server, 8.4)
      olddb:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3307:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot" --health-interval 3s --health-timeout 3s --health-retries 40
    env:
      OLD_DB_TEST: "1"
      OLD_DB_HOST: 127.0.0.1
      OLD_DB_PORT: "3307"
      OLD_DB_USER: root
      OLD_DB_PASS: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: mysql client
        run: mysql --version
      - name: Backend install
        working-directory: app-backend
        run: npm ci --no-audit --no-fund
      - name: Backend typecheck
        working-directory: app-backend
        run: npm run typecheck
      - name: Backend tests
        working-directory: app-backend
        run: |
          cp .env.example .env && npm run db:migrate && npm run db:check
          set +e; npm test > test.log 2>&1; code=$?; set -e
          grep -v '^# \[otp\]' test.log | tail -n 40
          if [ $code -ne 0 ]; then echo "===== FAILURES ====="; grep -n -A30 '^not ok' test.log | head -n 160; fi
          exit $code
      - name: API spec up to date
        working-directory: app-backend
        run: npm run openapi
      - name: Frontend install
        working-directory: app-frontend
        run: npm ci --no-audit --no-fund
      - name: Frontend build
        working-directory: app-frontend
        run: npm run build
      - name: End-to-end (app on the API, live HLS camera)
        working-directory: app-frontend
        run: |
          cd ../app-backend
          npm run db:seed:demo
          nohup npx tsx --env-file=.env src/index.ts > ../api.log 2>&1 &
          cd ../app-frontend
          VITE_API_URL=http://localhost:8080 npx vite build --outDir dist-live
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
          mkdir -p dist-live/hls
          ffmpeg -loglevel error -i public/bay-cam.mp4 -an -c:v libx264 -g 30 -f hls -hls_time 2 -hls_list_size 0 dist-live/hls/cam3.m3u8
          nohup npx vite preview --outDir dist-live --port 5173 --strictPort > ../web.log 2>&1 &
          (cd ../app-backend && node -e "const pg=require('pg');const c=new pg.Client('postgres://bikesurgeon:bikesurgeon@localhost:5433/bikesurgeon');c.connect().then(()=>c.query(\"UPDATE bays SET camera_stream_url='http://localhost:5173/hls/cam3.m3u8' WHERE code='BAY-03'\")).then(()=>c.end())")
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health >/dev/null && curl -sf http://localhost:5173/ >/dev/null && break; sleep 1; done
          npm i --no-save --no-audit --no-fund playwright@1.49.1
          google-chrome --version
          set +e; PW_CHANNEL=chrome node e2e/live-smoke.mjs; code=$?; set -e
          if [ $code -ne 0 ]; then echo "--- api.log"; tail -n 40 ../api.log; fi
          exit $code
      - name: Commit the regenerated API spec and screenshots
        if: always() && github.ref == 'refs/heads/claude/project-thread-vczbd1'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add app-backend/openapi.json
          [ -d e2e-shots ] && git add e2e-shots
          if ! git diff --cached --quiet; then
            git commit -m "CI: regenerated openapi.json and end-to-end screenshots"
            git push
          fi

  # The server setup (scripts/server/setup.sh) run on a copy of the Bike Surgeon CloudPanel server: a plain Ubuntu
  # with a stand-in clpctl, the admin panel's .env, the live old app (app.bikesurgeon.online, site user bikesurgeon-app),
  # the old billing MySQL, the Inventory feed and a bay camera. Three starts: a server without the app; the real server
  # of 25 Nov 2026, where the first version of the setup had put the app into the live app's site user (with a pm2 for the
  # whole server); and that server without a usable pm2, so the old app must be stopped by its process.
  server-rehearsal:
    needs: check
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    strategy:
      fail-fast: false
      matrix:
        start: [fresh, moved, moved-no-pm2]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot" --health-interval 3s --health-timeout 3s --health-retries 40
    steps:
      - name: Programs a CloudPanel server already has
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git curl ca-certificates openssl cron iproute2 procps mysql-client ffmpeg xz-utils >/dev/null
      - uses: actions/checkout@v4
      - name: Setup exactly as on the server, then a tester's checks (${{ matrix.start }})
        env:
          TEST_PHONES: "98765 43210, 9123456780"
          WORKSHOP_PHONE: "9845000000"
          PUBLIC_URL: http://127.0.0.1:3050
          NO_SERVER_PM2: ${{ matrix.start == 'moved-no-pm2' && '1' || '' }}
        run: |
          export REPO_URL="file://$GITHUB_WORKSPACE" BRANCH="$GITHUB_REF_NAME"
          bash scripts/server/rehearsal/prepare.sh
          bash scripts/server/rehearsal/${{ matrix.start }}.sh
      - name: Logs
        if: failure()
        run: |
          for h in /home/bikesurgeon-api /home/bikesurgeon-app; do
            echo "== $h"; ls -la "$h" 2>/dev/null || true
            tail -n 80 "$h/logs/update.log" 2>/dev/null || true
            tail -n 60 "$h"/.pm2/logs/*.log 2>/dev/null || true
          done
          cat /tmp/clpctl.log /tmp/fake-inventory.log /tmp/fake-services.log 2>/dev/null || true

  # The one command run on the server: GitHub must serve the script at the address in its header, and the code must
  # clone without a login (the server has no GitHub key).
  setup-command:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: The setup command downloads the script and the branch clones without a login
        run: |
          url=$(grep -o 'https://raw.githubusercontent.com/[^ ]*/setup.sh' scripts/server/setup.sh | head -1)
          echo "$url"
          curl -fsSL --retry 3 "$url" -o "$RUNNER_TEMP/bs-app-setup.sh"
          head -1 "$RUNNER_TEMP/bs-app-setup.sh" | grep -qxF '#!/usr/bin/env bash'
          tail -1 "$RUNNER_TEMP/bs-app-setup.sh" | grep -qxF 'main "$@"; exit $?'
          bash -n "$RUNNER_TEMP/bs-app-setup.sh"
          cmp -s "$RUNNER_TEMP/bs-app-setup.sh" scripts/server/setup.sh && echo "same as this commit" || echo "GitHub still serves the copy from a few minutes ago"
          repo=$(sed -n 's/^REPO_URL=${REPO_URL:-\(.*\)}$/\1/p' scripts/server/setup.sh)
          branch=$(sed -n 's/^BRANCH=${BRANCH:-\(.*\)}$/\1/p' scripts/server/setup.sh)
          echo "$repo $branch"
          cd "$RUNNER_TEMP"
          GIT_TERMINAL_PROMPT=0 git -c credential.helper= ls-remote --exit-code "$repo" "refs/heads/$branch"
          echo "PASS setup command"

  # Test APK for phones: talks to https://api.bikesurgeon.online (app.bikesurgeon.online is the live old app). Built only when the app's files changed, and saved
  # as downloads/bike-surgeon.apk (the server offers it at /download/bike-surgeon.apk). Always signed with the same
  # test key, so a newer APK installs over the old one.
  android-apk:
    needs: check
    runs-on: ubuntu-latest
    env:
      APP_URL: https://api.bikesurgeon.online
    steps:
      - uses: actions/checkout@v4
      - name: Anything new for the APK?
        id: inputs
        run: |
          sum=$( (echo "$APP_URL"; git ls-files -s app-frontend | grep -v -e 'app-frontend/e2e/' -e 'test-signing/') | sha256sum | cut -c1-16)
          echo "sum=$sum" >> "$GITHUB_OUTPUT"
          if [ "$(cat downloads/bike-surgeon.inputs 2>/dev/null)" = "$sum" ] && [ "${{ github.event_name }}" != workflow_dispatch ]; then
            echo "build=no" >> "$GITHUB_OUTPUT"; echo "The APK is up to date."
          else
            echo "build=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.inputs.outputs.build == 'yes'
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        if: steps.inputs.outputs.build == 'yes'
        with:
          distribution: temurin
          java-version: 21
      - name: Build the APK
        if: steps.inputs.outputs.build == 'yes'
        working-directory: app-frontend
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          npm ci --no-audit --no-fund
          VITE_API_URL="$APP_URL" npm run build
          npx cap sync android
          KS=android/test-signing/debug.keystore
          if [ ! -f "$KS" ]; then
            mkdir -p android/test-signing
            keytool -genkeypair -keystore "$KS" -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Bike Surgeon test,O=Bike Surgeon,C=IN"
          fi
          mkdir -p ~/.android && cp "$KS" ~/.android/debug.keystore
          cd android && ./gradlew assembleDebug --no-daemon --console=plain -q
          ls -la app/build/outputs/apk/debug/
      - name: Save the APK on the branch
        if: steps.inputs.outputs.build == 'yes'
        run: |
          mkdir -p downloads
          cp app-frontend/android/app/build/outputs/apk/debug/app-debug.apk downloads/bike-surgeon.apk
          echo "${{ steps.inputs.outputs.sum }}" > downloads/bike-surgeon.inputs
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f downloads/bike-surgeon.apk downloads/bike-surgeon.inputs app-frontend/android/test-signing/debug.keystore
          git commit -q -m "CI: test APK $(date -u +%F) (run ${{ github.run_number }})"
          for i in 1 2 3; do git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
