# Deploys the Firebase backend (rules, indexes, storage rules, Cloud Functions).
# Runs only when started by hand (Actions tab, once this file is on main) or by
# pushing a tag named deploy-backend-* (works from any branch).
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT: the JSON key of a Google Cloud
# service account in project bike-pharma-automobile (see backend/README.md).
name: Deploy backend

on:
  push:
    tags: ["deploy-backend-*"]
  workflow_dispatch:
    inputs:
      only:
        description: "What to deploy (blank = firestore,functions; e.g. storage)"
        required: false
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json
      - run: npm ci
        working-directory: backend/functions
      - run: npm test
        working-directory: backend/functions
      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - name: Create missing function secrets as "none"
        # The functions deploy fails if a secret doesn't exist. "none" turns that
        # feature off (see backend/README.md); set real values later.
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          printf 'none' > "$RUNNER_TEMP/none.txt"
          for s in SUREPASS_TOKEN RAZORPAY_KEY_ID RAZORPAY_KEY_SECRET RAZORPAY_WEBHOOK_SECRET; do
            if ! npx --yes firebase-tools@latest functions:secrets:access "$s" --project bike-pharma-automobile >/dev/null 2>&1; then
              echo "Creating $s = none"
              npx --yes firebase-tools@latest functions:secrets:set "$s" --data-file "$RUNNER_TEMP/none.txt" --project bike-pharma-automobile --non-interactive --force
            fi
          done
      - name: Deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          ONLY: ${{ inputs.only }}
        run: |
          # Storage needs its bucket created in the console first (Storage > Get started),
          # so by default deploy the database and functions only.
          npx --yes firebase-tools@latest deploy --project bike-pharma-automobile --only "${ONLY:-firestore,functions}" --non-interactive --force
