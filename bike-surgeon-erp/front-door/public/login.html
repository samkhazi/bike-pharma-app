<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bike Surgeon · Sign in</title>
<link rel="icon" href="/__gate/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/__gate/gate.css">
</head>
<body>
<main class="wrap">
  <form class="box" id="f">
    <div class="logo"><img src="/__gate/logo.svg" alt="Bike Surgeon"></div>
    <h1>Sign in</h1>
    <label>Mobile number or email<input id="email" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></label>
    <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
    <div class="err" id="err" role="alert"></div>
    <button class="pri" type="submit" id="go">Sign in</button>
    <small class="muted">One login for every panel. Your login opens your own panel.</small>
  </form>
</main>
<script src="/__gate/login.js"></script>
</body>
</html>
