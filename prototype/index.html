<title>Bike Pharma Prototype</title>
<meta name="theme-color" content="#121212">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Chakra+Petch:wght@600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --ink:#121212; --ink7:#3A3A3A; --ink5:#6E6E6E; --ink3:#BDBDBD;
  --y:#FFC20E; --y-deep:#7A5600; --y-soft:#FFF6D6;
  --paper:#F5F5F2; --card:#FFFFFF; --line:#E8E8E4;
  --g:#0F9D58; --g-soft:#E7F6EE; --r:#D93025; --r-soft:#FDECEA;
  --amber:#B7791F; --amber-soft:#FFF3D6; --blue:#2563EB; --blue-soft:#E8F0FE;
  --stage:#0B0B0B;
  --ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --brand:"Chakra Petch","Plus Jakarta Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);font-family:var(--ui);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--y);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* stage + device */
.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:40px;padding-inline:16px;position:relative;overflow:hidden}
.stage::before,.stage::after{content:"";position:absolute;height:6px;width:520px;background:var(--y);transform:rotate(-40deg);opacity:.9}
.stage::before{top:40px;right:-160px}.stage::after{bottom:-40px;left:-260px}
.device{position:relative;width:390px;height:min(844px,calc(100% - 32px));border-radius:46px;background:var(--paper);box-shadow:0 0 0 10px #1f1f1f,0 0 0 12px #2c2c2c,0 30px 80px rgba(0,0,0,.6);overflow:hidden;display:flex;flex-direction:column;z-index:1}
.aside{max-width:300px;color:#d9d9d4;z-index:1}
.aside h1{font-family:var(--brand);font-size:34px;line-height:1.05;margin:0 0 6px;color:#fff;letter-spacing:.5px}
.aside h1 span{color:var(--y)}
.aside p{font-size:13px;line-height:1.6;color:#a9a9a3;margin:0 0 14px}
.aside .acc{display:grid;gap:6px}
.aside .acc button{display:flex;justify-content:space-between;gap:10px;text-align:left;background:#1b1b1b;border:1px solid #2b2b2b;border-radius:12px;padding:9px 12px;font-size:12px;color:#eee}
.aside .acc button:hover{border-color:var(--y)}
.aside .acc b{color:var(--y);font-weight:700;white-space:nowrap}
@media (max-width:820px){.aside{display:none}.stage::before,.stage::after{display:none}}
@media (max-width:500px){
  .stage{padding:0}
  .device{width:100%;height:100%;border-radius:0;box-shadow:none}
}

/* app chrome */
.status{height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 26px 0;font-size:13px;font-weight:700}
.status.dark{background:var(--ink);color:#fff}
.status .bars{display:flex;gap:3px;align-items:flex-end}.status .bars i{width:3px;background:currentColor;border-radius:1px;display:block}
.status .bat{width:22px;height:11px;border-radius:3px;background:currentColor;margin-left:4px}
@media (max-width:500px){.status{display:none}}
.viewport{position:relative;flex:1;min-height:0;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper)}
.screen.dark{background:var(--ink);color:#fff}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pad{padding:12px 20px 28px;display:flex;flex-direction:column;gap:18px}
.in-push{animation:push .32s cubic-bezier(.2,.8,.2,1)}
.in-back{animation:back .32s cubic-bezier(.2,.8,.2,1)}
.in-fade{animation:fade .28s ease-out}
@keyframes push{from{transform:translateX(100%)}to{transform:none}}
@keyframes back{from{transform:translateX(-30%);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.in-push,.in-back,.in-fade{animation:none}}

/* top bar */
.bar{flex:none;display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.bar h2{flex:1;margin:0;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--paper);flex:none;position:relative}
.iconbtn.line{background:var(--card);border:1px solid var(--line)}
.iconbtn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--r);border:2px solid var(--card)}
.iconbtn .cnt{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--y);color:var(--ink);font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}

svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.s16{width:16px;height:16px}svg.s18{width:18px;height:18px}svg.s20{width:20px;height:20px}svg.s28{width:28px;height:28px}svg.s40{width:40px;height:40px}

/* type */
.h1{font-size:23px;font-weight:800;margin:0;line-height:1.2;text-wrap:balance}
.h2{font-size:18px;font-weight:700;margin:0}
.h3{font-size:15px;font-weight:700;margin:0}
.body{font-size:14px;line-height:1.5}
.cap{font-size:12px;font-weight:500;color:var(--ink5);line-height:1.4}
.micro{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.muted{color:var(--ink5)}
.amt{font-size:28px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.link{color:var(--y-deep);font-weight:700;font-size:13px}
.sec{display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;gap:12px}
.row.top{align-items:flex-start}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.stack.g6{gap:6px}.stack.g8{gap:8px}
.wrap{flex-wrap:wrap}

/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.flush{padding:0;gap:0;overflow:hidden}
.dark-card{background:var(--ink);color:#fff;border-radius:18px;padding:16px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px}
.dark-card::before,.dark-card::after{content:"";position:absolute;height:4px;background:var(--y);transform:rotate(-40deg);right:-30px;top:18px;width:110px}
.dark-card::after{right:-50px;top:34px;width:120px}
.dark-card > *{position:relative;z-index:1}
.tile{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--y-soft);color:var(--ink)}
.tile.y{background:var(--y)}.tile.k{background:var(--ink);color:var(--y)}.tile.g{background:var(--g-soft);color:var(--g)}.tile.r{background:var(--r-soft);color:var(--r)}.tile.b{background:var(--blue-soft);color:var(--blue)}.tile.n{background:var(--paper);color:var(--ink7)}
.tile.sm{width:36px;height:36px;border-radius:11px}
.tile.round{border-radius:50%}
.hr{height:1px;background:var(--line);width:100%}
.li{display:flex;align-items:center;gap:12px;padding:13px 16px;text-align:left;width:100%}
.li + .li{border-top:1px solid var(--line)}
.li .t{font-weight:700;font-size:14px}
.li .s{font-size:12px;color:var(--ink5);margin-top:2px}
.chev{color:var(--ink3)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.kv span:first-child{color:var(--ink5)}
.kv span:last-child{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.kv.big span:last-child{font-size:17px;font-weight:800}

/* pills & chips */
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 10px;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;background:var(--paper);color:var(--ink7)}
.pill.g{background:var(--g-soft);color:var(--g)}.pill.r{background:var(--r-soft);color:var(--r)}.pill.a{background:var(--amber-soft);color:var(--amber)}.pill.b{background:var(--blue-soft);color:var(--blue)}.pill.y{background:var(--y-soft);color:var(--y-deep)}.pill.k{background:var(--ink);color:var(--y)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-20px;padding-inline:20px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:8px 14px;font-size:12px;font-weight:600;background:var(--card);border:1px solid var(--line);color:var(--ink7)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;text-align:left;font-size:13px;font-weight:600}
.opt.on{border-color:var(--y);background:var(--y-soft)}
.radio{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--ink3);flex:none;background:var(--card)}
.opt.on .radio,.radio.on{border:6px solid var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:14px;background:var(--y);color:var(--ink);font-weight:800;font-size:14px;letter-spacing:.04em;text-transform:uppercase;width:100%;transition:transform .12s ease,filter .12s}
.btn:active{transform:scale(.97)}
.btn.dark{background:var(--ink);color:var(--y)}
.btn.line{background:var(--card);border:1.5px solid var(--ink);color:var(--ink)}
.btn.red{background:var(--r);color:#fff}
.btn.sm{height:38px;border-radius:10px;font-size:11px;padding-inline:14px;width:auto}
.btn[disabled]{opacity:.4;pointer-events:none}
.foot{flex:none;background:var(--card);border-top:1px solid var(--line);padding:12px 20px 18px;display:flex;flex-direction:column;gap:10px}
.foot .sum{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink5)}
.foot .sum b{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}

/* inputs */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field label{font-size:12px;font-weight:600;color:var(--ink5)}
.inp{height:52px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;display:flex;align-items:center;gap:10px;padding:0 14px}
.inp:focus-within{border-color:var(--ink)}
.inp{min-width:0}
.inp input,.inp select{width:100%}
.inp input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:15px;font-weight:600}
.inp.err{border-color:var(--r)}
.errmsg{font-size:12px;color:var(--r);font-weight:600}
.search{height:48px;border:1px solid var(--line);background:var(--card);border-radius:14px;display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--ink5)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:14px}

/* product */
.pcard{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;text-align:left}
.pimg{height:104px;background:var(--paper);display:grid;place-items:center;color:var(--ink3);position:relative}
.pimg .off{position:absolute;left:8px;top:8px}
.pimg .fav{position:absolute;right:8px;top:8px;color:var(--ink5)}
.pimg .fav.on{color:var(--r)}.pimg .fav.on svg{fill:var(--r)}
.pbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.pname{font-size:13px;font-weight:700;line-height:1.3;min-height:34px}
.price{display:flex;align-items:center;gap:6px;margin-top:4px}
.price b{font-size:16px;font-weight:800}
.price s{font-size:11px;color:var(--ink5)}
.addbtn{margin-left:auto;width:28px;height:28px;border-radius:9px;background:var(--y);display:grid;place-items:center}

/* bottom nav */
.nav{flex:none;position:relative;background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.06);display:grid;grid-template-columns:repeat(5,1fr);padding:12px 8px 16px;--i:0;z-index:5}
.nav .bubble{position:absolute;top:-24px;left:calc(8px + (100% - 16px) / 5 * var(--i) + (100% - 16px) / 10 - 28px);width:56px;height:56px;border-radius:50%;background:var(--y);color:var(--ink);display:grid;place-items:center;box-shadow:0 0 0 6px var(--paper),0 8px 18px rgba(255,194,14,.45);transition:left .38s cubic-bezier(.3,1.3,.5,1)}
.nav .bubble svg{animation:pop .38s ease}
@keyframes pop{0%{transform:scale(.4) rotate(-40deg);opacity:0}100%{transform:none;opacity:1}}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--ink5)}
.nav button.on{color:var(--ink);font-weight:800}
.nav button.on svg{opacity:0}
@media (prefers-reduced-motion:reduce){.nav .bubble{transition:none}.nav .bubble svg{animation:none}}

/* toast + sheet */
.toast{position:absolute;left:50%;bottom:110px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:30;display:flex;gap:8px;align-items:center;max-width:calc(100% - 40px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{color:var(--y)}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;animation:fade .2s}
.sheet{background:var(--card);width:100%;border-radius:24px 24px 0 0;padding:20px 20px 24px;display:flex;flex-direction:column;gap:14px;animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}

/* splash + auth */
.splash{position:absolute;inset:0;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden;z-index:40;transition:opacity .45s}
.splash.out{opacity:0;pointer-events:none}
.splash .st{position:absolute;height:6px;background:var(--y);transform:rotate(-40deg)}
.splash .st1{width:280px;top:30px;right:-90px;animation:sl1 .9s cubic-bezier(.2,.8,.2,1) both}
.splash .st2{width:220px;top:62px;right:-90px;animation:sl1 .9s .08s cubic-bezier(.2,.8,.2,1) both}
.splash .st3{width:280px;bottom:40px;left:-100px;animation:sl2 .9s cubic-bezier(.2,.8,.2,1) both}
.splash .st4{width:220px;bottom:72px;left:-100px;animation:sl2 .9s .08s cubic-bezier(.2,.8,.2,1) both}
@keyframes sl1{from{transform:translate(200px,-200px) rotate(-40deg)}}
@keyframes sl2{from{transform:translate(-200px,200px) rotate(-40deg)}}
.splash .logo{width:120px;height:120px;animation:spin 1s cubic-bezier(.2,.8,.2,1) both;filter:drop-shadow(0 0 30px rgba(255,194,14,.45))}
@keyframes spin{from{transform:rotate(-180deg) scale(.3);opacity:0}}
.wordmark{font-family:var(--brand);font-weight:700;font-size:34px;color:#fff;letter-spacing:1px;line-height:1}
.wordsub{font-family:var(--brand);font-weight:600;font-size:12px;letter-spacing:.45em;color:var(--y);margin-left:.45em}
.splash .wordmark,.splash .wordsub{animation:fade .6s .45s both}
.hero{background:var(--ink);color:#fff;padding:26px 24px 34px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:8px;flex:none}
.hero::before,.hero::after{content:"";position:absolute;height:5px;background:var(--y);transform:rotate(-40deg);width:180px;right:-50px;top:26px}
.hero::after{top:48px;right:-70px;width:200px}
.hero .logo{width:72px;height:72px}
.hero .wordmark{font-size:26px}
.hero .wordsub{font-size:10px}
.sheet-card{margin-top:-18px;background:var(--card);border-radius:24px 24px 0 0;flex:1;padding:24px 22px;display:flex;flex-direction:column;gap:16px;position:relative}
.otp{display:flex;gap:8px;justify-content:space-between}
.otp input{width:46px;height:56px;border:1.5px solid var(--line);border-radius:14px;text-align:center;font-size:22px;font-weight:800;outline:0;background:var(--card)}
.otp input:focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--y-soft)}
.hint{background:var(--y-soft);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--y-deep);font-weight:600;display:flex;gap:8px;align-items:center}
.accs{display:grid;gap:6px}
.accs button{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);font-size:12px;text-align:left}
.accs button b{font-weight:800}
.accs button span{color:var(--ink5)}

/* misc */
.money{border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px;border:1.5px solid}
.money.w{background:var(--g-soft);border-color:var(--g)}
.money.c{background:var(--r-soft);border-color:var(--r)}
.money .lab{display:flex;align-items:center;gap:8px}
.money.w .lab,.money.w .amt{color:var(--g)}
.money.c .lab,.money.c .amt{color:var(--r)}
.stat{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:3px;background:var(--card);border:1px solid var(--line)}
.stat .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.stat.y{background:var(--y-soft);border-color:transparent}.stat.g{background:var(--g-soft);border-color:transparent}.stat.g .v{color:var(--g)}.stat.r{background:var(--r-soft);border-color:transparent}.stat.r .v{color:var(--r)}.stat.b{background:var(--blue-soft);border-color:transparent}
.qa{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;text-align:center;color:var(--ink7)}
.qa .tile{width:56px;height:56px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.qa2{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:600;text-align:center}
.qa2.locked{opacity:.55}
.tbl{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.tbl th{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink5);text-align:left;padding:10px 8px;background:var(--paper)}
.tbl td{padding:10px 8px;border-top:1px solid var(--line)}
.tbl .r{text-align:right}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.cbars{display:flex;align-items:flex-end;gap:8px;height:110px}
.cbars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:10px;color:var(--ink5)}
.cbars i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--y-soft)}
.cbars div:last-child i{background:var(--y)}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--y);border-radius:99px}
.step{display:flex;gap:12px}
.step .dotc{display:flex;flex-direction:column;align-items:center}
.step .dotc b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--ink5)}
.step.done .dotc b{background:var(--g);color:#fff}.step.now .dotc b{background:var(--y);color:var(--ink)}
.step .dotc i{flex:1;width:2px;background:var(--line);min-height:22px}
.step.done .dotc i{background:var(--g)}
.step .txt{padding-bottom:14px}
.qty{display:inline-flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-weight:800;background:var(--card)}
.qty button{display:grid;place-items:center}
.map{height:190px;border-radius:18px;background:
 linear-gradient(0deg,transparent 48%,#fff 48%,#fff 52%,transparent 52%) 0 0/100% 38px,
 linear-gradient(90deg,transparent 48%,#fff 48%,#fff 52%,transparent 52%) 0 0/64px 100%,#EDEBE3;position:relative;overflow:hidden}
.map .pin{position:absolute;width:32px;height:32px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.map .pin.on{background:var(--y);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}

/* ---------- warranty (days, auto-started on billing) ---------- */
const warText=d=>!d?'No warranty':d%365===0?`${d} days (${d/365} yr${d>365?'s':''})`:d%30===0?`${d} days (${d/30} mo)`:`${d} days`;
const isoToday=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const addDays=(iso,n)=>{const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const fmtD=iso=>new Date(iso+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
const daysLeft=w=>Math.round((new Date(addDays(w.start,w.days)+'T00:00:00')-new Date(isoToday()+'T00:00:00'))/864e5);
const warState=w=>{const l=daysLeft(w);return l<0?['Expired','',l]:l<=30?[l+' days left','a',l]:['Active','g',l];};
function issueWarranties(lines,party,pname,inv,src){const out=[];lines.forEach(([id,q])=>{const x=P(id);if(!x||!x.warDays)return;const w={id:'W-'+(1001+DB.warranties.length),inv,pid:id,name:x.name,pn:x.pn,party,pname,start:isoToday(),days:x.warDays,qty:q,src};DB.warranties.unshift(w);out.push(w);});return out;}
function warCard(w,staff){const [st,t,l]=warState(w);const pc=Math.min(1,Math.max(0,1-l/w.days));return `<div class="card"><div class="row top"><div class="tile sm ${t==='g'?'g':t==='a'?'y':'n'}">${ic('shield','s18')}</div><div class="grow"><div class="h3">${esc(w.name)}${w.qty>1?' × '+w.qty:''}</div><div class="cap">${esc(w.inv)} · ${esc(w.src)}${staff?' · '+esc(w.pname):''}</div></div><span class="pill ${t}">${st}</span></div><div class="prog"><i style="width:${pc*100}%;background:${t==='g'?'var(--g)':t==='a'?'var(--y)':'var(--ink3)'}"></i></div><div class="sec cap"><span>${fmtD(w.start)} → ${fmtD(addDays(w.start,w.days))} · ${w.days} days</span>${staff?'':`<button class="link" onclick="toast('Warranty claim started for ${esc(w.inv)}')" ${l<0?'disabled style="opacity:.4"':''}>Claim</button>`}</div></div>`;}
SCREENS.warreg=()=>{const f=S.ui.wf||'All';const q=(S.ui.wq||'').trim().toLowerCase();let list=DB.warranties.filter(w=>!q||(w.name+' '+w.pn+' '+w.inv+' '+w.party+' '+w.pname).toLowerCase().includes(q));
 const cnt=k=>DB.warranties.filter(w=>warState(w)[0]===k||(k==='Expiring'&&warState(w)[1]==='a')).length;
 if(f==='Active')list=list.filter(w=>warState(w)[1]==='g');if(f==='Expiring')list=list.filter(w=>warState(w)[1]==='a');if(f==='Expired')list=list.filter(w=>warState(w)[0]==='Expired');
 return bar('Warranty register')+`<div class="scroll"><div class="pad">
 <p class="cap">Every warranty starts automatically when a bill is made, using the days set on the product.</p>
